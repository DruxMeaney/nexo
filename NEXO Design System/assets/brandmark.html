<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXO — Brand mark</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f8f5;--ink:#18201c;--muted:#5d675f;--teal:#0f6f6a;--teal-dark:#0a4d4a;--line:#d9dfd8;
    --font-sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);
    display:flex;flex-wrap:wrap;gap:40px;align-items:center;padding:48px;}
  .brand{display:inline-flex;align-items:center;gap:11px;font-weight:700;font-size:1.4rem;letter-spacing:.16em;text-transform:uppercase;}
  .brand-mark{display:grid;width:34px;height:34px;place-items:center;border:1px solid rgba(15,111,106,.3);
    border-radius:10px;background:#f1f8f5;color:var(--teal);}
  .brand.lg{font-size:2.6rem;letter-spacing:.12em;}
  .brand.lg .brand-mark{width:62px;height:62px;border-radius:16px;}
  .brand.inv{color:#fff;}
  .brand.inv .brand-mark{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#7fd3c9;}
  .dark{background:#0d1816;padding:28px 36px;border-radius:14px;}
  .stack{display:flex;flex-direction:column;gap:8px;}
  .cap{font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:720;}
  .dark .cap{color:#8fb3aa;}
</style>
</head>
<body>
  <div class="stack">
    <span class="cap">Primary lockup</span>
    <span class="brand">
      <span class="brand-mark"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg></span>
      <span>NEXO</span>
    </span>
  </div>

  <div class="stack">
    <span class="cap">Large</span>
    <span class="brand lg">
      <span class="brand-mark"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg></span>
      <span>NEXO</span>
    </span>
  </div>

  <div class="dark stack">
    <span class="cap">On dark (hero)</span>
    <span class="brand inv lg">
      <span class="brand-mark"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg></span>
      <span>NEXO</span>
    </span>
  </div>
</body>
</html>
