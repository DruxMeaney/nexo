<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Cards & panels</title><link rel="stylesheet" href="_card.css">
<style>
  .card{flex:1;border:1px solid var(--line);border-radius:8px;background:#fff;padding:18px;box-shadow:0 1px 0 rgba(24,32,28,.03);}
  .card svg{width:24px;height:24px;color:#0a4d4a;margin-bottom:10px;}
  .card h3{margin:0 0 8px;font-size:1rem;}
  .card p{margin:0;color:var(--muted);line-height:1.55;font-size:.86rem;}
  .welcome{flex:1;border:1px solid var(--line);border-radius:12px;background:#fff;padding:18px;box-shadow:0 24px 70px rgba(24,32,28,.12);}
  .welcome .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:#e9f5f2;color:#0a4d4a;margin-bottom:10px;}
  .welcome h3{margin:0 0 6px;font-size:1.05rem;}
  .welcome p{margin:0;color:var(--muted);font-size:.84rem;line-height:1.5;}
  svg{width:22px;height:22px;}
</style></head>
<body>
  <div class="row" style="align-items:stretch;gap:14px;">
    <div class="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v5h5"/></svg><h3>Corpus científico</h3><p>Procesa carpetas locales con PDFs, TXT o MD.</p></div>
    <div class="welcome"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg></div><h3>Diseñar un nuevo protocolo</h3><p>Te guiamos paso a paso para definir tus dos variables.</p></div>
  </div>
</body></html>
