<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Dark surfaces & tints</title><link rel="stylesheet" href="_card.css">
<style>
  .sw{display:flex;flex-direction:column;gap:7px;flex:1;}
  .chip{height:48px;border-radius:8px;display:flex;align-items:center;padding:0 12px;font-size:.74rem;font-weight:700;}
  .name{font-size:.74rem;font-weight:700;}
  .hex{font-family:var(--font-mono);font-size:.68rem;color:var(--muted);}
</style></head>
<body>
  <div class="row" style="gap:12px;align-items:stretch;">
    <div class="sw"><div class="chip" style="background:#0d1816;color:#fff">hero-bg</div><div class="hex">#0d1816</div></div>
    <div class="sw"><div class="chip" style="background:#101816;color:#dce8e0">log-bg / terminal</div><div class="hex">#101816 · ink #dce8e0</div></div>
  </div>
  <div class="row" style="gap:12px;align-items:stretch;margin-top:2px;">
    <div class="sw"><div class="chip" style="background:#e9f5f2;color:#0a4d4a">tint teal</div><div class="hex">#e9f5f2</div></div>
    <div class="sw"><div class="chip" style="background:#f9ece4;color:#a84c24">tint rust</div><div class="hex">#f9ece4</div></div>
    <div class="sw"><div class="chip" style="background:linear-gradient(180deg,#fff,#f3faf7);color:#0a4d4a;border:1px solid rgba(15,111,106,.3)">premium gradient</div><div class="hex">#fff → #f3faf7</div></div>
  </div>
</body></html>
