<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Status & steps</title><link rel="stylesheet" href="_card.css">
<style>
  .status{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:.86rem;}
  .dot{display:grid;width:28px;height:28px;place-items:center;border-radius:8px;}
  .running .dot{background:#e4f3ef;color:#0a4d4a;}
  .done .dot{background:#eaf4df;color:#627c35;}
  .step{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;}
  .num{display:grid;width:36px;height:36px;place-items:center;border-radius:8px;background:#0a4d4a;color:#fff;font-weight:780;}
  .step b{font-size:.95rem;}.step span{color:var(--muted);font-size:.8rem;}
  svg{width:16px;height:16px;}
</style></head>
<body>
  <div class="status running"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span><div><b>Minería y análisis contextual</b> · En ejecución</div></div>
  <div class="status done"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg></span><div><b>Validación del corpus</b> · Listo</div></div>
  <div class="step"><span class="num">3</span><div><b>Taxonomía</b><br><span>Construye la lista de términos a buscar.</span></div></div>
</body></html>
