<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Radii</title><link rel="stylesheet" href="_card.css">
<style>
  .sw{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;}
  .box{width:100%;height:58px;background:#fff;border:1px solid var(--line);}
  .lbl{font-size:.74rem;font-weight:700;}
  .meta{font-family:var(--font-mono);font-size:.66rem;color:var(--muted);}
</style></head>
<body>
  <div class="row" style="gap:14px;align-items:stretch;">
    <div class="sw"><div class="box" style="border-radius:6px"></div><div class="lbl">r-sm</div><div class="meta">6px</div></div>
    <div class="sw"><div class="box" style="border-radius:7px"></div><div class="lbl">r-md</div><div class="meta">7px · buttons</div></div>
    <div class="sw"><div class="box" style="border-radius:8px"></div><div class="lbl">r-lg</div><div class="meta">8px · cards</div></div>
    <div class="sw"><div class="box" style="border-radius:12px"></div><div class="lbl">r-xl</div><div class="meta">12px</div></div>
    <div class="sw"><div class="box" style="border-radius:999px"></div><div class="lbl">pill</div><div class="meta">999px</div></div>
  </div>
</body></html>
