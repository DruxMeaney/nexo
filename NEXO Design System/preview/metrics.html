<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Metric cards</title><link rel="stylesheet" href="_card.css">
<style>
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .metric{display:grid;gap:4px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:18px;border-left:3px solid var(--teal);box-shadow:0 1px 0 rgba(24,32,28,.03);}
  .metric strong{font-size:1.8rem;line-height:1;font-weight:760;}
  .metric span{color:var(--muted);font-size:.86rem;}
</style></head>
<body>
  <div class="grid">
    <div class="metric"><strong>128</strong><span>Artículos</span></div>
    <div class="metric"><strong>3 472</strong><span>Menciones</span></div>
    <div class="metric"><strong>614</strong><span>Relaciones</span></div>
    <div class="metric"><strong>22</strong><span>Figuras</span></div>
  </div>
</body></html>
