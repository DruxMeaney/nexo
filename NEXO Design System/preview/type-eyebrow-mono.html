<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Eyebrow & mono</title><link rel="stylesheet" href="_card.css">
<style>
  body{gap:16px;}
  .eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--font-sans);font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-dark);}
  .eyebrow::before{content:"";width:26px;height:1px;background:currentColor;opacity:.55;}
  .index{font-family:var(--font-mono);font-size:.82rem;font-weight:500;color:var(--teal);letter-spacing:.06em;}
  .monoblk{font-family:var(--font-mono);font-size:.84rem;background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--ink);letter-spacing:-.01em;}
  .meta{font-family:var(--font-mono);font-size:.66rem;color:var(--muted);}
</style></head>
<body>
  <div>
    <div class="eyebrow">PRISMA · evidencia textual</div>
    <div class="meta" style="margin-top:8px;">Eyebrow · Hanken Grotesk 600 · 0.72rem · tracking 0.14em · UPPERCASE · hairline rule</div>
  </div>
  <div>
    <span class="index">01 — Método</span>
    <div class="meta" style="margin-top:6px;">Section index numeral · JetBrains Mono 500</div>
  </div>
  <div>
    <div class="monoblk">config/protocols/contaminantes_enfermedades · \bplomo\b · mg/L</div>
    <div class="meta" style="margin-top:6px;">Mono · JetBrains Mono · paths, regex, slugs, logs, data</div>
  </div>
</body></html>
