<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Neutrals</title><link rel="stylesheet" href="_card.css">
<style>
  .sw{display:flex;flex-direction:column;gap:8px;flex:1;}
  .chip{height:64px;border-radius:8px;border:1px solid var(--line);}
  .name{font-size:.78rem;font-weight:700;}
  .hex{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);}
</style></head>
<body>
  <div class="row" style="gap:14px;align-items:stretch;">
    <div class="sw"><div class="chip" style="background:#f7f8f5"></div><div><div class="name">bg</div><div class="hex">#f7f8f5</div></div></div>
    <div class="sw"><div class="chip" style="background:#ffffff"></div><div><div class="name">surface</div><div class="hex">#ffffff</div></div></div>
    <div class="sw"><div class="chip" style="background:#eef2ec"></div><div><div class="name">surface-muted</div><div class="hex">#eef2ec</div></div></div>
    <div class="sw"><div class="chip" style="background:#18201c"></div><div><div class="name">ink</div><div class="hex">#18201c</div></div></div>
    <div class="sw"><div class="chip" style="background:#5d675f"></div><div><div class="name">muted</div><div class="hex">#5d675f</div></div></div>
    <div class="sw"><div class="chip" style="background:#d9dfd8"></div><div><div class="name">line</div><div class="hex">#d9dfd8</div></div></div>
  </div>
</body></html>
