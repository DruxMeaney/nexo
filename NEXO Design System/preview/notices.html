<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Notices</title><link rel="stylesheet" href="_card.css">
<style>
  .notice{display:flex;gap:12px;padding:14px;border-radius:8px;line-height:1.45;font-size:.86rem;}
  .warn{border:1px solid rgba(138,91,18,.28);background:#fff8e7;color:#4b3820;}
  .danger{border:1px solid rgba(156,47,47,.35);background:#fdecec;color:#5a1f1f;}
  .notice strong{display:block;margin-bottom:2px;}
  svg{width:20px;height:20px;flex-shrink:0;}
  .warn svg{color:#b87813;}.danger svg{color:#9c2f2f;}
</style></head>
<body>
  <div class="notice warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><div><strong>Interpretación metodológica</strong>Una mención no equivale a asociación. Una co-ocurrencia no equivale a causalidad.</div></div>
  <div class="notice danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><div><strong>Error</strong>No se pudo cargar la información del protocolo.</div></div>
</body></html>
