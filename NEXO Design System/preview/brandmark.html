<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Brand mark</title><link rel="stylesheet" href="_card.css">
<style>

  .mark{display:grid;width:38px;height:38px;place-items:center;border:1px solid rgba(15,111,106,.3);border-radius:10px;background:#f1f8f5;color:#0f6f6a;}

  .dark .brand{color:#fff;}
  .dark .mark{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#7fd3c9;}
  svg{width:21px;height:21px;}
</style></head>

  <div class="row" style="gap:22px;">
