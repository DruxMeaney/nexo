<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Accents</title><link rel="stylesheet" href="_card.css">
<style>
  .sw{display:flex;flex-direction:column;gap:8px;flex:1;}
  .chip{height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.06);}
  .name{font-size:.78rem;font-weight:700;}
  .hex{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);}
</style></head>
<body>
  <div class="row" style="gap:14px;align-items:stretch;">
    <div class="sw"><div class="chip" style="background:#0f6f6a"></div><div><div class="name">teal</div><div class="hex">#0f6f6a</div></div></div>
    <div class="sw"><div class="chip" style="background:#0a4d4a"></div><div><div class="name">teal-dark</div><div class="hex">#0a4d4a</div></div></div>
    <div class="sw"><div class="chip" style="background:#a84c24"></div><div><div class="name">rust</div><div class="hex">#a84c24</div></div></div>
    <div class="sw"><div class="chip" style="background:#627c35"></div><div><div class="name">olive</div><div class="hex">#627c35</div></div></div>
    <div class="sw"><div class="chip" style="background:#315f8a"></div><div><div class="name">blue</div><div class="hex">#315f8a</div></div></div>
  </div>
</body></html>
