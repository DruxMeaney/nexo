<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Layout & spacing</title><link rel="stylesheet" href="_card.css">
<style>
  .bar{display:flex;align-items:flex-end;gap:10px;}
  .u{background:var(--tint-teal);border:1px solid rgba(15,111,106,.25);border-radius:5px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;color:var(--teal-dark);font-family:var(--font-mono);font-size:.62rem;}
  .meta{font-family:var(--font-mono);font-size:.68rem;color:var(--muted);}
</style></head>
<body>
  <div class="bar">
    <div class="u" style="width:8px;height:24px;"></div>
    <div class="u" style="width:12px;height:34px;">12</div>
    <div class="u" style="width:16px;height:48px;">16</div>
    <div class="u" style="width:22px;height:62px;">22</div>
    <div class="u" style="width:38px;height:80px;">38</div>
    <div class="u" style="width:68px;height:96px;">68</div>
  </div>
  <div class="meta">Grid gap 16 · card pad 18–22 · section pad 68 (38 compact) · column min(1180px, 100% − 32px)</div>
</body></html>
