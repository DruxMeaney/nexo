<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Display type</title><link rel="stylesheet" href="_card.css">
<style>
  body{gap:10px;}
  .hero{font-family:var(--font-serif);font-size:3.4rem;line-height:1;font-weight:500;letter-spacing:-.02em;}
  .hero em{font-style:italic;color:var(--teal-dark);}
  .sec{font-family:var(--font-serif);font-size:2.1rem;line-height:1.05;font-weight:500;letter-spacing:-.015em;}
  .meta{font-family:var(--font-mono);font-size:.66rem;color:var(--muted);}
</style></head>
<body>
  <div class="hero">De PDFs a <em>evidencia auditable</em></div>
  <div class="meta">Hero h1 · Newsreader 500 · clamp(3.2rem, 7.5vw, 6rem) · line-height 1.0 · tracking −0.02em</div>
  <div class="sec" style="margin-top:6px;">Resultados auditables</div>
  <div class="meta">Section h2 · Newsreader 500 · clamp(2rem, 4vw, 3rem) · italic for emphasis</div>
</body></html>
