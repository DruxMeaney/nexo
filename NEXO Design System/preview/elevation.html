<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Elevation</title><link rel="stylesheet" href="_card.css">
<style>
  body{background:#f7f8f5;}
  .sw{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;}
  .box{width:100%;height:56px;background:#fff;border:1px solid var(--line);border-radius:8px;}
  .lbl{font-size:.72rem;font-weight:700;}
  .meta{font-family:var(--font-mono);font-size:.64rem;color:var(--muted);text-align:center;}
</style></head>
<body>
  <div class="row" style="gap:18px;align-items:stretch;">
    <div class="sw"><div class="box" style="box-shadow:0 1px 0 rgba(24,32,28,.03)"></div><div class="lbl">flush</div><div class="meta">0 1px 0 /.03</div></div>
    <div class="sw"><div class="box" style="box-shadow:0 14px 38px rgba(24,32,28,.08)"></div><div class="lbl">card hover</div><div class="meta">0 14px 38px /.08</div></div>
    <div class="sw"><div class="box" style="box-shadow:0 24px 70px rgba(24,32,28,.12)"></div><div class="lbl">lift</div><div class="meta">0 24px 70px /.12</div></div>
    <div class="sw"><div class="box" style="box-shadow:0 28px 80px rgba(24,32,28,.16)"></div><div class="lbl">hi</div><div class="meta">0 28px 80px /.16</div></div>
  </div>
</body></html>
